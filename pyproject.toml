[project]
name = "dnabc"
dynamic = [ "version" ]
description = "Demultiplex pooled DNA sequencing data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }

authors = [
  { name = "Kyle Bittinger", email = "kylebittinger@gmail.com" },
  { name = "Charlie Bushman", email = "ctbushman@gmail.com" },
]

maintainers = [
  { name = "Kyle Bittinger", email = "kylebittinger@gmail.com" },
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
]

[project.urls]
"homepage" = "https://github.com/PennChopMicrobiomeProgram/dnabc"

[project.scripts]
"dnabc" = "dnabc.main:main"
"split_samplelanes" = "dnabc.split_samplelanes:main"

[build-system]
requires = [ "setuptools>=61.0.0", "wheel" ]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dnabc.__version__" }

